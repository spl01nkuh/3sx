name: Build (iOS)

on:
  workflow_dispatch:
  push:
    branches: ["ios-port"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS ${{ matrix.sdk }} (unsigned)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [device, simulator]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check build tools
        id: toolchain
        run: |
          xcodebuild -version
          cmake --version
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import subprocess
          commands = [
              ["xcodebuild", "-version"],
              ["xcode-select", "-p"],
              ["xcrun", "--sdk", "iphoneos", "--show-sdk-version"],
              ["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"],
              ["cmake", "--version"],
          ]
          versions = b"".join(subprocess.check_output(command) for command in commands)
          print("cache_id=" + hashlib.sha256(versions).hexdigest())
          PY

      - name: Restore iOS build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/ios-${{ matrix.sdk }}
          key: ios-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.sdk }}-${{ steps.toolchain.outputs.cache_id }}-${{ hashFiles('cmake/ios.cmake', 'tools/build-ios.sh') }}

      - name: Build native iOS app
        run: |
          set -o pipefail
          bash tools/build-ios.sh "${{ matrix.sdk }}" 2>&1 | tee build-ios.log
        env:
          CONFIGURATION: Release
          BUILD_JOBS: 4

      - name: Package simulator app
        if: matrix.sdk == 'simulator'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Release-iphonesimulator/3SX.app \
            build/ios-simulator/3SX-simulator.zip

      - name: Test portable touch input
        run: |
          cc -std=c2x -DCRS_PLATFORM_IOS=1 -Isrc \
            -Ibuild/ios-${{ matrix.sdk }}/_deps/threesx_sdl-src/include \
            tools/tests/test-ios-touch.c src/platform/input/ios/ios_touch_state.c \
            -o /tmp/test-ios-touch
          /tmp/test-ios-touch

      - name: Test local AFS packaging helper
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Test iOS options logic
        run: |
          cc -std=c2x -DCRS_PLATFORM_IOS=1 -Isrc \
            -Ibuild/ios-${{ matrix.sdk }}/_deps/threesx_sdl-src/include \
            tools/tests/test-ios-options.c src/platform/app/ios/ios_options.c \
            -lm -o /tmp/test-ios-options
          /tmp/test-ios-options

      - name: Test controller input through game conversion
        run: |
          cmake -S tools/tests/controller -B build/controller-host -G Ninja \
            -DSDL3_SOURCE_DIR="$PWD/build/ios-${{ matrix.sdk }}/_deps/threesx_sdl-src" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/controller-host --parallel 4
          ctest --test-dir build/controller-host --output-on-failure

      - name: Test touch layout geometry
        run: |
          cc -std=c2x -DCRS_PLATFORM_IOS=1 -Isrc \
            -Ibuild/ios-${{ matrix.sdk }}/_deps/threesx_sdl-src/include \
            tools/tests/test-ios-layout.c src/platform/input/ios/ios_layout.c \
            -lm -o /tmp/test-ios-layout
          /tmp/test-ios-layout

      - name: Compile iOS CRT Metal shader
        run: xcrun --sdk iphoneos metal -x metal -c src/platform/video/sdl_gpu/shaders/compiled/msl/ios_crt.frag -o /tmp/ios-crt.air

      - name: Render CRT reference images on Metal
        if: matrix.sdk == 'simulator'
        shell: bash
        run: |
          clang -O2 -fobjc-arc -framework Metal -framework Foundation \
            tools/tests/test-ios-crt-metal.m -o /tmp/test-ios-crt-metal
          set +e
          /tmp/test-ios-crt-metal src/platform/video/sdl_gpu/shaders/compiled/msl/ios_crt.frag build/ios-crt-visuals
          result=$?
          set -e
          if [ "$result" -eq 77 ]; then
            echo "Metal image rendering skipped: this runner has no Metal device. Shader compilation remains required."
          elif [ "$result" -ne 0 ]; then
            exit "$result"
          fi

      - name: Upload CRT reference results
        if: always() && matrix.sdk == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: ios-crt-reference-results
          path: build/ios-crt-visuals
          if-no-files-found: warn

      - name: Verify Apple bundle recognition with preloaded data
        run: swift tools/tests/test-ios-bundle.swift build/ios-${{ matrix.sdk }}/Release-${{ matrix.sdk == 'device' && 'iphoneos' || 'iphonesimulator' }}/3SX.app

      - name: Upload unsigned device IPA
        if: matrix.sdk == 'device'
        uses: actions/upload-artifact@v4
        with:
          name: 3SX-iOS-device-unsigned
          path: |
            build/ios-device/3SX-unsigned.ipa
            build/ios-device/personalize-ios-ipa.py
            build/ios-device/INSTALL.txt
          if-no-files-found: error

      - name: Upload simulator app
        if: matrix.sdk == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: 3SX-iOS-simulator
          path: build/ios-simulator/3SX-simulator.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.sdk }}-build-log
          path: build-ios.log

      - name: Save iOS build cache
        if: always() && steps.cache.outputs.cache-hit != 'true' && steps.cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: build/ios-${{ matrix.sdk }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
